version: "3.9"

services:
  db:
    image: postgres:15
    container_name: postgres-db
    restart: always
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: mydatabase
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myuser -d mydatabase"]
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak:
    container_name: keycloak.openid-provider
    image: quay.io/keycloak/keycloak:26.0.1
    command:
      - start-dev
      - --import-realm
    ports:
      - "8082:8082"
    volumes:
      - ./keycloak/:/opt/keycloak/data/import/
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin

      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://db:5432/mydatabase  # ✅ matches service name 'db'
      KC_DB_USERNAME: myuser
      KC_DB_PASSWORD: mypassword

      KC_HTTP_PORT: 8082
      KC_HOSTNAME_URL: http://localhost:8082
      KC_HOSTNAME_ADMIN_URL: http://localhost:8082
      KC_HOSTNAME_STRICT_BACKCHANNEL: "true"
      KC_HTTP_RELATIVE_PATH: /
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy   # ✅ waits for postgres to be ready
    healthcheck:
      test: [ 'CMD-SHELL', '[ -f /tmp/HealthCheck.java ] || echo "public class HealthCheck { public static void main(String[] args) throws java.lang.Throwable { System.exit(java.net.HttpURLConnection.HTTP_OK == ((java.net.HttpURLConnection)new java.net.URL(args[0]).openConnection()).getResponseCode() ? 0 : 1); } }" > /tmp/HealthCheck.java && java /tmp/HealthCheck.java http://localhost:8082/health/live' ]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres_data: